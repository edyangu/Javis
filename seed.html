<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Javis - Seed Data</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>JAVIS SEED</h1>
  <nav><a href="dashboard.html">Back to Dashboard</a></nav>
</header>
<main>
  <div class="card">
    <h2>Create Org Data</h2>
    <p class="muted">Run this once while logged in. It writes orgs/{your-uid} and orgs/{your-uid}/config/main with the default event details.</p>
    <p id="seed-status" class="muted"></p>
    <button onclick="seedNow()">Seed My Account</button>
  </div>
</main>

<script type="module">
import { auth, db } from "./js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

let uid = null;
onAuthStateChanged(auth, (user) => {
  uid = user ? user.uid : null;
  const s = document.getElementById("seed-status");
  if (user) {
    s.textContent = "Logged in as " + user.email + " (uid: " + user.uid + ")";
  } else {
    s.textContent = "Not logged in. Go to login.html first.";
  }
});

window.seedNow = async function () {
  const s = document.getElementById("seed-status");
  if (!uid) { s.textContent = "Not logged in. Go to login.html first."; return; }

  try {
    // 1. org doc
    await setDoc(doc(db, "orgs", uid), {
      name: "Test Org",
      ownerUid: uid,
      createdAt: serverTimestamp()
    }, { merge: true });

    // 2. config/main with prices as a proper map
    await setDoc(doc(db, "orgs", uid, "config", "main"), {
      orgName: "Javis Events",
      eventName: "Live Concert Night",
      location: "Kampala, Uganda",
      entryTime: "7:00 PM",
      currency: "UGX",
      prices: {
        ordinary: 50000,
        vip: 150000
      },
      mtnNumber: "0770000000",
      airtelNumber: "0750000000"
    }, { merge: true });

    // 3. verify
    const check = await getDoc(doc(db, "orgs", uid, "config", "main"));
    if (check.exists()) {
      s.textContent = "Success. Config exists for " + uid + ". Open dashboard.html.";
    } else {
      s.textContent = "Write reported success but doc not found. Check rules.";
    }
  } catch (e) {
    s.textContent = "ERROR: " + (e.code || e.message);
    console.error(e);
  }
};
</script>
</body>
</html>
